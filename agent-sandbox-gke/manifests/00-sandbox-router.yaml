apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-router
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: sandbox-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-router
  labels:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: sandbox-router
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-router
  labels:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: sandbox-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-router
subjects:
- kind: ServiceAccount
  name: sandbox-router
  namespace: agent-sandbox-system
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-router-svc
  namespace: agent-sandbox-system
  labels:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: sandbox-router
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: sandbox-router
  ports:
  - name: proxy
    port: 8080
    targetPort: proxy
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-router
  namespace: agent-sandbox-system
  labels:
    app: sandbox-router
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: sandbox-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-router
      app.kubernetes.io/component: sandbox-router
  template:
    metadata:
      labels:
        app: sandbox-router
        app.kubernetes.io/name: sandbox-router
        app.kubernetes.io/component: sandbox-router
    spec:
      serviceAccountName: sandbox-router
      containers:
      - name: sandbox-router
        image: registry.k8s.io/agent-sandbox/sandbox-router-go:v1.0.6
        imagePullPolicy: IfNotPresent
        args:
        - --http-bind-address=:8080
        - --metrics-bind-address=:9090
        - --health-probe-bind-address=:8081
        - --cluster-domain=cluster.local
        - --proxy-timeout=180s
        - --upstream-max-retries=3
        - --cache-enabled=true
        ports:
        - name: proxy
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        - name: healthz
          containerPort: 8081
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
          initialDelaySeconds: 1
          periodSeconds: 5
          failureThreshold: 2
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
      terminationGracePeriodSeconds: 45
